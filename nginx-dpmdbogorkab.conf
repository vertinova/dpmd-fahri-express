server {
    listen 80;
    # Domain primary sejak 23 Juli 2026. dpmdbogorkab.id tidak lagi melayani
    # aplikasi — ia dialihkan ke halaman pemberitahuan di server block paling
    # bawah, yang meneruskan path ke sini. Karena itu QR arsip barang lama
    # (buildScanUrl di src/controllers/arsipBarang.controller.js) tetap sampai
    # ke tujuan tanpa perlu dicetak ulang.
    server_name dpmd.bogorkab.go.id;

    client_max_body_size 150M;

    # Modul .mjs (worker pdf.js): paksa MIME JavaScript yang benar.
    # mime.types bawaan tidak memetakan .mjs → tanpa ini disajikan sebagai
    # application/octet-stream dan ditolak browser (module worker wajib MIME JS),
    # menyebabkan "Gagal memuat PDF" di editor anotasi Kecamatan. Blok `types`
    # lokal menjamin hasilnya, lepas dari keadaan mime.types global.
    location ~* \.mjs$ {
        root /var/www/frontend/dist;
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    # Cangkang aplikasi WAJIB divalidasi ulang ke server setiap kali dibuka.
    # Tanpa header ini nginx tidak mengirim Cache-Control sama sekali, dan
    # browser jatuh ke heuristic caching: ia menebak sendiri masa segar dari
    # Last-Modified, sehingga index.html dan sw.js lama bisa dianggap masih
    # segar berjam-jam. Akibatnya perangkat tetap menjalankan build lama meski
    # deploy baru sudah live — perbaikan tidak pernah sampai ke user, dan
    # menekan "Update sekarang" pun tidak menolong karena yang dimuat ulang
    # tetap berkas yang sama dari cache.
    #
    # Berkas di /assets/ sengaja tidak ikut: namanya sudah mengandung hash isi,
    # jadi setiap perubahan menghasilkan nama baru dan aman di-cache selamanya.
    location ~* ^/(index\.html|sw\.js|sw-custom\.js|registerSW\.js|workbox-[^/]+\.js|version\.json|manifest\.json|manifest\.webmanifest)$ {
        root /var/www/frontend/dist;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Frontend: static files
    location / {
        root /var/www/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Nama berkas di sini mengandung hash isi, jadi isinya tidak pernah berubah
    # di balik nama yang sama. Aman disimpan selamanya, dan itu yang membuat
    # `no-cache` pada cangkang di atas murah: hanya index.html dan sw.js yang
    # divalidasi ulang, bukan belasan megabyte bundel.
    location /assets/ {
        root /var/www/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── HLS webinar broadcast (penonton massal, target ribuan) ──
    # WAJIB ada: tanpa blok ini, /hls/<room>/index.m3u8 jatuh ke `location /`
    # (try_files → index.html) sehingga penonton dapat HTML, bukan playlist → HLS mati.
    # Disajikan LANGSUNG dari disk oleh nginx (bukan lewat Node/express.static) agar
    # ringan & skalabel untuk ribuan penonton. ffmpeg menulis ke
    # /var/www/backend/storage/hls/<roomId>/ (root di bawah memetakan /hls → storage/hls).
    # Skala sangat besar: arahkan VITE_HLS_BASE_URL ke CDN yang origin-nya ke sini.
    # Pastikan user nginx (www-data) bisa baca /var/www/backend/storage/hls.
    location /hls/ {
        root /var/www/backend/storage;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Resource-Policy cross-origin always;

        # Playlist: jangan di-cache — penonton harus selalu ambil daftar segmen terbaru.
        location ~ \.m3u8$ {
            root /var/www/backend/storage;
            try_files $uri =404;
            add_header Access-Control-Allow-Origin * always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        # Segmen .ts: nama unik (seg_%05d) & konten tetap → boleh di-cache lama di
        # edge CDN (immutable). Origin menghapus segmen lama (hls_list_size), tapi CDN
        # tetap melayani salinannya → 1000 penonton = ~1 request/segmen ke origin.
        location ~ \.ts$ {
            root /var/www/backend/storage;
            try_files $uri =404;
            add_header Access-Control-Allow-Origin * always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Cache-Control "public, max-age=60, immutable" always;
        }
    }

    # Socket.io WebSocket proxy
    location /socket.io {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Backend API proxy
    location /api {
        client_max_body_size 200M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Storage files proxy
    location /storage {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads proxy
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GitHub Webhook endpoint
    location /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public files proxy
    location /public {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ── Domain lama: halaman pemberitahuan pindah ──
# dpmdbogorkab.id tidak lagi melayani aplikasi (entry apex-nya dihapus dari NPM
# lalu dibuat ulang mengarah ke sini). Blok ini HARUS di bawah server block
# utama: yang pertama terdefinisi menjadi default_server, dan default itu wajib
# tetap milik dpmd.bogorkab.go.id.
#
# Semua path dilayani index.html yang sama supaya JS di dalamnya bisa membaca
# path asli dan meneruskannya ke domain baru — dengan begitu tautan lama,
# termasuk QR arsip barang yang sudah tercetak, tetap mendarat di halaman benar.
server {
    listen 80;
    server_name dpmdbogorkab.id;

    root /var/www/backend/landing-domain-pindah;

    # $uri didahulukan agar aset nyata (logo) tetap tersaji; sisanya — path apa
    # pun dari tautan lama — jatuh ke index.html supaya JS-nya bisa membaca path
    # asli dan meneruskannya ke domain baru.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
