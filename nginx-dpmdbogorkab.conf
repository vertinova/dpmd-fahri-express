server {
    listen 80;
    # Domain tunggal sejak 23 Juli 2026. dpmdbogorkab.id (domain sementara) dan
    # apps.dpmdbogorkab.id dihapus sepenuhnya, termasuk entry-nya di NPM.
    # Konsekuensi yang sudah disetujui: QR arsip barang yang tercetak sebelum
    # tanggal ini memuat domain lama dan harus dicetak ulang — lihat
    # buildScanUrl() di src/controllers/arsipBarang.controller.js.
    server_name dpmd.bogorkab.go.id;

    client_max_body_size 150M;

    # Modul .mjs (worker pdf.js): paksa MIME JavaScript yang benar.
    # mime.types bawaan tidak memetakan .mjs → tanpa ini disajikan sebagai
    # application/octet-stream dan ditolak browser (module worker wajib MIME JS),
    # menyebabkan "Gagal memuat PDF" di editor anotasi Kecamatan. Blok `types`
    # lokal menjamin hasilnya, lepas dari keadaan mime.types global.
    location ~* \.mjs$ {
        root /var/www/frontend/dist;
        types { application/javascript mjs; }
        default_type application/javascript;
        try_files $uri =404;
    }

    # Frontend: static files
    location / {
        root /var/www/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── HLS webinar broadcast (penonton massal, target ribuan) ──
    # WAJIB ada: tanpa blok ini, /hls/<room>/index.m3u8 jatuh ke `location /`
    # (try_files → index.html) sehingga penonton dapat HTML, bukan playlist → HLS mati.
    # Disajikan LANGSUNG dari disk oleh nginx (bukan lewat Node/express.static) agar
    # ringan & skalabel untuk ribuan penonton. ffmpeg menulis ke
    # /var/www/backend/storage/hls/<roomId>/ (root di bawah memetakan /hls → storage/hls).
    # Skala sangat besar: arahkan VITE_HLS_BASE_URL ke CDN yang origin-nya ke sini.
    # Pastikan user nginx (www-data) bisa baca /var/www/backend/storage/hls.
    location /hls/ {
        root /var/www/backend/storage;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Resource-Policy cross-origin always;

        # Playlist: jangan di-cache — penonton harus selalu ambil daftar segmen terbaru.
        location ~ \.m3u8$ {
            root /var/www/backend/storage;
            try_files $uri =404;
            add_header Access-Control-Allow-Origin * always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        # Segmen .ts: nama unik (seg_%05d) & konten tetap → boleh di-cache lama di
        # edge CDN (immutable). Origin menghapus segmen lama (hls_list_size), tapi CDN
        # tetap melayani salinannya → 1000 penonton = ~1 request/segmen ke origin.
        location ~ \.ts$ {
            root /var/www/backend/storage;
            try_files $uri =404;
            add_header Access-Control-Allow-Origin * always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header Cache-Control "public, max-age=60, immutable" always;
        }
    }

    # Socket.io WebSocket proxy
    location /socket.io {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Backend API proxy
    location /api {
        client_max_body_size 200M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Storage files proxy
    location /storage {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads proxy
    location /uploads {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GitHub Webhook endpoint
    location /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public files proxy
    location /public {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
